<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Aura X — Documentation</title>
  <meta name="description" content="Aura X Drawing UI Library Documentation">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify-themeable@0/dist/css/theme-simple-dark.css">
  <style>
    :root {
      --theme-color: #8a5ad5;
      --sidebar-background: #111118;
      --sidebar-border-color: #2a2840;
      --sidebar-name-color: #8a5ad5;
      --sidebar-nav-link-color--active: #8a5ad5;
      --sidebar-nav-link-border-color--active: #8a5ad5;
      --content-max-width: 55em;
      --code-inline-background: #1a1a2e;
      --code-theme-background: #12121e;
    }
    .sidebar .app-name { font-size: 1.6em; font-weight: 700; }
    .markdown-section h1 { color: #8a5ad5; }
    .markdown-section table { border-collapse: collapse; width: 100%; }
    .markdown-section th { background: #1a1a2e; color: #8a5ad5; }
    .markdown-section td, .markdown-section th { padding: 8px 12px; border: 1px solid #2a2840; }
    .markdown-section code { color: #c4a8f0; }
    .cover-main { background: linear-gradient(135deg, #111118 0%, #1a1030 100%) !important; }
    .cover-main h1 { color: #8a5ad5 !important; }
  </style>
</head>
<body>
  <div id="app"></div>
  <script>
    window.$docsify = {
      name: '🌀 Aura X',
      repo: 'x8qz/Aura-X',
      loadSidebar: true,
      subMaxLevel: 3,
      coverpage: true,
      auto2top: true,
      search: {
        placeholder: 'Search docs...',
        noData: 'No results.',
        paths: 'auto'
      },
      copyCode: {
        buttonText: 'Copy',
        successText: 'Copied!'
      }
    }
  </script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/docsify.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-copy-code@2/dist/docsify-copy-code.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-lua.min.js"></script>
</body>
</html>
